<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" role="img" aria-label="桌面">
  <defs>
    <linearGradient id="tile" x1="16" y1="10" x2="102" y2="112" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#F6F8FC"/>
      <stop offset="1" stop-color="#EDF2F8"/>
    </linearGradient>
    <linearGradient id="core" x1="37" y1="31" x2="86" y2="91" gradientUnits="userSpaceOnUse">
      <stop stop-color="#54C1FF"/>
      <stop offset="0.42" stop-color="#2E8BFA"/>
      <stop offset="0.76" stop-color="#3D70F2"/>
      <stop offset="1" stop-color="#5763E8"/>
    </linearGradient>
    <radialGradient id="core-light" cx="0" cy="0" r="1" gradientTransform="translate(48 39) rotate(51) scale(35 42)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="tile-shadow" x="-20%" y="-18%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="5" stdDeviation="5.5" flood-color="#40566E" flood-opacity="0.18"/>
    </filter>
    <filter id="halo-shadow" x="-30%" y="-30%" width="160%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#274B83" flood-opacity="0.20"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#FFFFFF" flood-opacity="0.75"/>
    </filter>
    <filter id="core-shadow" x="-30%" y="-30%" width="160%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#314FC1" flood-opacity="0.28"/>
    </filter>
    <clipPath id="core-clip">
      <circle cx="60" cy="59" r="34"/>
    </clipPath>
  </defs>

  <rect x="5" y="4" width="110" height="111" rx="28" fill="url(#tile)" filter="url(#tile-shadow)"/>
  <rect x="6" y="5" width="108" height="109" rx="27" stroke="#FFFFFF" stroke-width="2"/>
  <rect x="8" y="7" width="104" height="105" rx="25" stroke="#CAD5E4" stroke-opacity="0.46"/>

  <circle cx="60" cy="59" r="42" fill="#FFFFFF" filter="url(#halo-shadow)"/>
  <circle cx="60" cy="59" r="39.5" stroke="#D7E1EF" stroke-opacity="0.62"/>

  <g filter="url(#core-shadow)">
    <circle cx="60" cy="59" r="34" fill="url(#core)"/>
    <g clip-path="url(#core-clip)">
      <ellipse cx="47" cy="39" rx="31" ry="28" fill="url(#core-light)"/>
      <path d="M31 77C45 70 74 70 89 77" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <rect x="40" y="38" width="40" height="30" rx="8" stroke="#FFFFFF" stroke-width="4.5"/>
  <rect x="39" y="75" width="42" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.96"/>
  <circle cx="47" cy="80" r="1.8" fill="#3C7AF4"/>
  <circle cx="53" cy="80" r="1.8" fill="#3C7AF4" fill-opacity="0.82"/>
  <circle cx="59" cy="80" r="1.8" fill="#3C7AF4" fill-opacity="0.64"/>
  <path d="M67 80H74" stroke="#3C7AF4" stroke-width="2.4" stroke-linecap="round"/>
</svg>
