services:
  db:
    image: pgvector/pgvector:pg16
    container_name: smartdiagram-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-smartdiagram_secret}
      POSTGRES_DB: smartdiagram
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: smartdiagram-redis
    restart: always
    ports:
      - "6379:6379"

  drawio:
    image: jgraph/drawio:latest
    container_name: smartdiagram-drawio
    restart: always
    environment:
      - DRAWIO_OFFLINE=true
    ports:
      - "9022:8080"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: smartdiagram-qdrant
    restart: always
    profiles:
      - qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        CN_MIRROR: ${CN_MIRROR:-false}
    container_name: smartdiagram-backend
    restart: always
    depends_on:
      - db
      - redis
    env_file:
      - ./backend/.env
    environment:
      # 覆盖容器内网络地址（.env 里是 localhost，容器间需要用服务名）
      - DATABASE_URL=postgresql+asyncpg://postgres:${DB_PASSWORD:-smartdiagram_secret}@db:5432/smartdiagram
      - REDIS_URL=redis://redis:6379/0
      - LANGCHAIN_TRACING_V2=false
    ports:
      - "9236:8000"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        CN_MIRROR: ${CN_MIRROR:-false}
    container_name: smartdiagram-worker
    restart: always
    profiles:
      - worker
    depends_on:
      - db
      - redis
    command: ["python", "scripts/run_enterprise_workers.py", "--loop"]
    env_file:
      - ./backend/.env
    environment:
      # 覆盖容器内网络地址
      - DATABASE_URL=postgresql+asyncpg://postgres:${DB_PASSWORD:-smartdiagram_secret}@db:5432/smartdiagram
      - REDIS_URL=redis://redis:6379/0

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        CN_MIRROR: ${CN_MIRROR:-false}
    container_name: smartdiagram-frontend
    restart: always
    depends_on:
      - backend
      - drawio
    ports:
      - "9237:80"

volumes:
  pgdata:
  qdrantdata:
