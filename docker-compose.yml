services:
  db:
    image: pgvector/pgvector:pg16
    container_name: smartdiagram-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-smartdiagram_secret}
      POSTGRES_DB: smartdiagram
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartdiagram"]
      interval: 2s
      timeout: 5s
      retries: 30

  # 无论是全新卷还是旧卷，都以幂等方式确保 PPT 独立库存在。
  ppt-db-init:
    # 这里只需要 psql 客户端；使用标准镜像可避免本地开发重复拉取 pgvector。
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${DB_PASSWORD:-smartdiagram_secret}
      PGDATABASE: smartdiagram
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if ! psql -tAc "SELECT 1 FROM pg_database WHERE datname='ppt_agent'" | grep -q 1; then
          psql -v ON_ERROR_STOP=1 -c 'CREATE DATABASE ppt_agent'
        fi

  redis:
    image: redis:7-alpine
    container_name: smartdiagram-redis
    restart: always
    ports:
      - "${REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  drawio:
    image: jgraph/drawio:latest
    container_name: smartdiagram-drawio
    restart: always
    environment:
      - DRAWIO_OFFLINE=true
    ports:
      - "9022:8080"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: smartdiagram-qdrant
    restart: always
    profiles:
      - qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage

  api-diagram:
    build:
      context: ./apps/api-diagram
      dockerfile: Dockerfile
      args:
        CN_MIRROR: ${CN_MIRROR:-false}
        UV_PYTHON_IMAGE: ${UV_PYTHON_IMAGE:-ghcr.io/astral-sh/uv:python3.13-bookworm-slim}
    container_name: smartdiagram-api-diagram
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: ./.env
        required: false
    environment:
      # 覆盖容器内网络地址（.env 里是 localhost，容器间需要用服务名）
      - DATABASE_URL=postgresql+asyncpg://postgres:${DB_PASSWORD:-smartdiagram_secret}@db:5432/smartdiagram
      - DIAGRAM_DATABASE_URL=postgresql+asyncpg://postgres:${DB_PASSWORD:-smartdiagram_secret}@db:5432/smartdiagram
      - REDIS_URL=redis://redis:6379/0
      - RUNTIME_RATE_LIMIT_BACKEND=redis
      - EXPORT_REDIS_QUEUE=${EXPORT_REDIS_QUEUE:-smartdiagram:queue:exports}
      - KNOWLEDGE_INGESTION_REDIS_QUEUE=${KNOWLEDGE_INGESTION_REDIS_QUEUE:-smartdiagram:knowledge:ingestion}
      - LANGCHAIN_TRACING_V2=false
      - PPT_INTERNAL_API_SECRET=${PPT_INTERNAL_API_SECRET:?Set PPT_INTERNAL_API_SECRET to a long random value}
    volumes:
      # local ObjectStorage 必须与独立 worker 共享；生产可改用 S3 兼容存储。
      - knowledgedata:/app/storage
    ports:
      - "9236:8000"

  worker:
    build:
      context: ./apps/api-diagram
      dockerfile: Dockerfile
      args:
        CN_MIRROR: ${CN_MIRROR:-false}
        UV_PYTHON_IMAGE: ${UV_PYTHON_IMAGE:-ghcr.io/astral-sh/uv:python3.13-bookworm-slim}
    container_name: smartdiagram-worker
    restart: always
    profiles:
      - worker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "scripts/run_enterprise_workers.py", "--loop"]
    env_file:
      - path: ./.env
        required: false
    environment:
      # 覆盖容器内网络地址
      - DATABASE_URL=postgresql+asyncpg://postgres:${DB_PASSWORD:-smartdiagram_secret}@db:5432/smartdiagram
      - DIAGRAM_DATABASE_URL=postgresql+asyncpg://postgres:${DB_PASSWORD:-smartdiagram_secret}@db:5432/smartdiagram
      - REDIS_URL=redis://redis:6379/0
      - EXPORT_REDIS_QUEUE=${EXPORT_REDIS_QUEUE:-smartdiagram:queue:exports}
      - KNOWLEDGE_INGESTION_REDIS_QUEUE=${KNOWLEDGE_INGESTION_REDIS_QUEUE:-smartdiagram:knowledge:ingestion}
      - WORKER_JOB_LOCK_TTL_SECONDS=${WORKER_JOB_LOCK_TTL_SECONDS:-1800}
      - PPT_INTERNAL_API_SECRET=${PPT_INTERNAL_API_SECRET:?Set PPT_INTERNAL_API_SECRET to a long random value}
    volumes:
      - knowledgedata:/app/storage
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from pathlib import Path; command = Path('/proc/1/cmdline').read_bytes(); raise SystemExit(0 if b'run_enterprise_workers.py' in command else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: ./
      dockerfile: apps/web/Dockerfile
      args:
        CN_MIRROR: ${CN_MIRROR:-false}
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:stable-alpine}
    container_name: smartdiagram-web
    restart: always
    depends_on:
      - api-diagram
      - drawio
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    # 只供统一 gateway 通过 Docker 内网访问，不直接占用宿主机 9237。
    expose:
      - "80"

  # ================= PPT Agent 模块 =================
  # 命名卷会覆盖镜像构建阶段设置的 /data 属主。每次启动前幂等校正两个
  # 子目录的 UID，保留现有文件内容，同时让 Node 与 Python 继续以非 root 运行。
  ppt-storage-init:
    image: pgvector/pgvector:pg16
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mkdir -p /data/storage /data/langgraph
        chown -R 1000:1000 /data/storage
        chown -R 10001:10001 /data/langgraph
        chmod 750 /data/storage
        chmod 700 /data/langgraph
    volumes:
      - pptdata:/data

  # Node 数据/渲染侧车（Prisma + PPTX 渲染，内部 4010）
  ppt-node-api:
    build:
      context: ./
      dockerfile: Dockerfile
      target: node-api
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim-bookworm}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:stable-alpine}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.10.5}
        CN_MIRROR: ${CN_MIRROR:-false}
    container_name: smartdiagram-ppt-node-api
    restart: always
    depends_on:
      db:
        condition: service_healthy
      api-diagram:
        condition: service_started
      ppt-db-init:
        condition: service_completed_successfully
      ppt-storage-init:
        condition: service_completed_successfully
    env_file:
      # AI/TTS 密钥从根目录 .env 注入（文件缺失时忽略，可用 AI_PROVIDER=mock 演示）
      - path: ./.env
        required: false
    environment:
      # 覆盖 .env 中的本机地址，适配容器网络；ppt-db-init 会先幂等创建独立库。
      - NODE_ENV=production
      - API_HOST=0.0.0.0
      - API_PORT=4010
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:-smartdiagram_secret}@db:5432/ppt_agent?schema=public
      - STORAGE_DIR=/data/storage
      - MATERIAL_GATEWAY_URL=http://api-diagram:8000
      - AUTH_SERVICE_URL=http://api-diagram:8000
      - USAGE_LEDGER_URL=http://api-diagram:8000
      - PPT_INTERNAL_API_SECRET=${PPT_INTERNAL_API_SECRET:?Set PPT_INTERNAL_API_SECRET to a long random value}
      - PPT_GUEST_PROJECT_TTL_SECONDS=${PPT_GUEST_PROJECT_TTL_SECONDS:-86400}
    volumes:
      - pptdata:/data
    expose:
      - "4010"

  # FastAPI + LangGraph 编排网关（内部 4000）
  ppt-python-api:
    build:
      context: ./
      dockerfile: Dockerfile
      target: python-api
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim-bookworm}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:stable-alpine}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.10.5}
        CN_MIRROR: ${CN_MIRROR:-false}
    container_name: smartdiagram-ppt-python-api
    restart: always
    depends_on:
      ppt-storage-init:
        condition: service_completed_successfully
      ppt-node-api:
        condition: service_started
    env_file:
      - path: ./.env
        required: false
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=4000
      - LEGACY_API_URL=http://ppt-node-api:4010
      - GRAPH_CHECKPOINT_PATH=/data/langgraph/checkpoints.sqlite
      - PPT_INTERNAL_API_SECRET=${PPT_INTERNAL_API_SECRET:?Set PPT_INTERNAL_API_SECRET to a long random value}
    volumes:
      - pptdata:/data
    expose:
      - "4000"

  # PPT Agent 前端已并入统一 SPA（apps/web），不再需要独立的 ppt-web 服务。

  # ================= 聚合网关（统一入口） =================
  #   /         → 统一前端 SPA（/ 首页 · /diagram 思维导图 · /ppt PPT 制作）
  #   /api/     → SmartDiagram 后端      /ppt-api/ → PPT Agent 后端
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
      args:
        CN_MIRROR: ${CN_MIRROR:-false}
        UV_PYTHON_IMAGE: ${UV_PYTHON_IMAGE:-ghcr.io/astral-sh/uv:python3.13-bookworm-slim}
    container_name: smartdiagram-gateway
    restart: always
    depends_on:
      web:
        condition: service_healthy
      api-diagram:
        condition: service_started
      drawio:
        condition: service_started
      ppt-python-api:
        condition: service_started
    ports:
      # 宝塔反向代理的唯一入口；统一分流 SPA、主 API、PPT API 和 Draw.io。
      - "${GATEWAY_PORT:-9237}:80"

  # 仅由 deploy.sh --backup/--update 临时调用。所有业务卷均只读挂载，
  # 归档写入宿主机 backups/，不会修改或删除线上用户文件。
  backup-volumes:
    image: pgvector/pgvector:pg16
    profiles:
      - tools
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        tar -C /source -czf /backup/user-volumes.tar.gz pptdata knowledgedata qdrantdata
    volumes:
      - pptdata:/source/pptdata:ro
      - knowledgedata:/source/knowledgedata:ro
      - qdrantdata:/source/qdrantdata:ro
      - ${BACKUP_DIR:-./backups}:/backup

  # 旧版本可能把上传文件写在 apps/api-diagram 容器层。deploy.sh 先 docker cp 到
  # 宿主机备份目录，再仅在目标卷为空时通过本工具导入，避免覆盖现有文件。
  legacy-storage-import:
    image: pgvector/pgvector:pg16
    profiles:
      - tools
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if [ -n "$(find /target -mindepth 1 -maxdepth 1 -print -quit)" ]; then
          echo "Target knowledge volume is not empty; refusing to overwrite" >&2
          exit 1
        fi
        cp -a /source/. /target/
    volumes:
      - knowledgedata:/target
      - ${LEGACY_STORAGE_SOURCE:-./backups}:/source:ro

volumes:
  pgdata:
  qdrantdata:
  pptdata:
  knowledgedata:
