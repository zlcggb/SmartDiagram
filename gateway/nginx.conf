# SmartDiagram 生产网关：统一 SPA + API 分流
#
#   /            → 统一前端（单 SPA：/ 首页 · /diagram 思维导图 · /ppt PPT 制作）
#   /api/        → SmartDiagram 后端 FastAPI :8000
#   /ppt-api/    → PPT Agent 后端 FastAPI :4000（剥离前缀，内部再转发 Node 侧车）
#   /drawio/     → drawio 容器（SmartDiagram 画板 iframe）

# conf.d 文件被包含在 http 上下文中，可在此定义 map
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 50m;

    # ---- 通用代理头 ----
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- SmartDiagram 后端 ----
    location /api/ {
        proxy_pass http://api-diagram:8000;
        # SSE 流式响应
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        # WebSocket 升级（如有）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # ---- PPT Agent 后端 ----
    location /ppt-api/ {
        # 剥离 /ppt-api 前缀；PPT 模块前端以 VITE_API_BASE_URL=/ppt-api 调用
        proxy_pass http://ppt-python-api:4000/;
        # 应用默认允许 50 MiB 净文件；网关保留 multipart 边界和配置调整余量。
        client_max_body_size 64m;
        proxy_request_buffering off;
        # 外部请求不能伪造内部资料来源或身份。
        # 真实身份应由认证层校验 token/cookie 后在服务端生成。
        proxy_set_header X-Origin-System "";
        proxy_set_header X-Origin-Project-Id "";
        proxy_set_header X-Origin-Material-Id "";
        proxy_set_header X-Tenant-Id "";
        proxy_set_header X-User-Id "";
        proxy_set_header X-Team-Id "";
        proxy_set_header X-Roles "";
        proxy_set_header X-Scopes "";
        proxy_set_header X-PPT-Internal-Secret "";
        # SSE 流式响应（生成进度）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # ---- drawio 画板（SmartDiagram 模块 iframe） ----
    location /drawio/ {
        proxy_pass http://drawio:8080/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---- 统一前端 SPA ----
    location / {
        proxy_pass http://web:80;
    }
}
