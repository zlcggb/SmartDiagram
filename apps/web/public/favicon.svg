<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background gradient: deep indigo to purple -->
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <!-- Node glow -->
    <radialGradient id="glow-a" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a5f3fc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-b" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-c" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <!-- Shine overlay -->
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Drop shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#312e81" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- Shine top overlay -->
  <rect width="64" height="32" rx="14" ry="14" fill="url(#shine)"/>

  <!-- ── Graph edges (curved lines connecting nodes) ── -->
  <!-- Top-left → center -->
  <path d="M16 18 C22 18 26 32 32 32" stroke="#a5b4fc" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
  <!-- Center → bottom-right -->
  <path d="M32 32 C38 32 42 46 48 46" stroke="#a5b4fc" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
  <!-- Top-right → center -->
  <path d="M48 18 C42 18 38 32 32 32" stroke="#c4b5fd" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
  <!-- Bottom-left → center -->
  <path d="M16 46 C22 46 26 32 32 32" stroke="#c4b5fd" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>

  <!-- ── Nodes ── -->
  <!-- Top-left node (cyan) -->
  <circle cx="16" cy="18" r="5.5" fill="#0e7490" opacity="0.9"/>
  <circle cx="16" cy="18" r="5.5" fill="url(#glow-a)"/>
  <circle cx="16" cy="18" r="3" fill="#e0f2fe"/>

  <!-- Top-right node (amber) -->
  <circle cx="48" cy="18" r="5.5" fill="#92400e" opacity="0.9"/>
  <circle cx="48" cy="18" r="5.5" fill="url(#glow-c)"/>
  <circle cx="48" cy="18" r="3" fill="#fef9c3"/>

  <!-- Bottom-left node (violet) -->
  <circle cx="16" cy="46" r="5.5" fill="#5b21b6" opacity="0.9"/>
  <circle cx="16" cy="46" r="5.5" fill="url(#glow-b)"/>
  <circle cx="16" cy="46" r="3" fill="#ede9fe"/>

  <!-- Bottom-right node (cyan) -->
  <circle cx="48" cy="46" r="5.5" fill="#0e7490" opacity="0.9"/>
  <circle cx="48" cy="46" r="5.5" fill="url(#glow-a)"/>
  <circle cx="48" cy="46" r="3" fill="#e0f2fe"/>

  <!-- Center hub (white, larger, glowing) -->
  <circle cx="32" cy="32" r="8" fill="#312e81" opacity="0.6"/>
  <circle cx="32" cy="32" r="8" fill="url(#glow-b)" opacity="0.8"/>
  <circle cx="32" cy="32" r="5.5" fill="white" opacity="0.95"/>

  <!-- "S" letterform inside center hub using paths (smart S-curve) -->
  <path d="M29.5 29.5 C29.5 28.2 30.5 27.5 32 27.5 C33.5 27.5 34.5 28.2 34.5 29.3 C34.5 30.4 33.2 31 32 31.5 C30.5 32.1 29.5 33 29.5 34.2 C29.5 35.5 30.5 36.5 32 36.5 C33.5 36.5 34.5 35.8 34.5 34.5"
        stroke="#4338ca" stroke-width="1.6" stroke-linecap="round" fill="none"/>
</svg>